[Service]
# The deployed frontend uses Supabase Auth. Keep the two hosted frontends and the
# Tailscale Funnel browser endpoint on the explicit credentialed-CORS allowlist.
Environment="CIPHER_HOSTED=1"
Environment="CIPHER_GUEST_MODE=1"
Environment="CIPHER_HOSTED_ORIGINS=https://web-omega-silk-71.vercel.app,https://web-finance-dashboard.vercel.app,https://cipher-main.tail39504f.ts.net:8443"
# EnvironmentFile values can supersede Environment= on some systemd versions.
# Put the three non-secret mode switches at process invocation so legacy values in
# cipher.env cannot silently roll hosted auth back off.
ExecStart=
ExecStart=/usr/bin/env CIPHER_HOSTED=1 CIPHER_GUEST_MODE=1 CIPHER_HOSTED_ORIGINS=https://web-omega-silk-71.vercel.app,https://web-finance-dashboard.vercel.app,https://cipher-main.tail39504f.ts.net:8443 /usr/bin/node /home/aarav/Aarav/cipher/cipher-system/app/server.mjs
