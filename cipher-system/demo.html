<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cipher Research</title>
<style>
:root{--bg:#07090e;--top:#0b0e14;--side:#0c1017;--panel:#0d1119;--line:#1a2230;--text:#d9dfeb;--muted:#778293;--pink:#d529bd;--purple:#9200d5;--red:#d90c1f;--yellow:#e4ae24;--soft:#141b27}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font:13px Inter,Arial,sans-serif;overflow:hidden}button,input{font:inherit}button{border:0;background:none;color:inherit;cursor:pointer}.app{height:100%;display:grid;grid-template:55px 1fr/190px 1fr}.top{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:0 16px;background:var(--top);border-bottom:1px solid #141b27}.brand{font-size:12px;font-weight:800;letter-spacing:1.2px;color:#f3f5fb;display:flex;align-items:center;gap:6px;margin-right:8px}.orb{width:13px;height:13px;border-radius:50%;background:radial-gradient(circle at 65% 28%,#d78aff 0 8%,#7e1bb2 30%,#191827 65%,#07070e 75%);box-shadow:0 0 7px #9d36db}.ticker{width:174px;height:30px;color:#dce1eb;background:#101620;border:1px solid #2a3342;border-radius:3px;padding:2px 6px;text-transform:uppercase;outline:none}.ticker:focus{border-color:#aa24ca}.quote{font-variant-numeric:tabular-nums;color:#aeb8c7}.quote strong{color:#f3f5fb;margin-right:5px}.source{font-size:10px;color:#a98abb;border:1px solid #4b285a;background:#211426;border-radius:3px;padding:3px 5px}.top-spacer{flex:1}.status{font-size:11px;color:#7e8999}.live{color:#91dc76;margin-right:3px}.rail{grid-row:2;background:var(--side);border-right:1px solid #151d29;padding:14px 10px}.rail-label{font-size:10px;letter-spacing:.7px;color:#515d6d;margin:7px 5px}.nav{width:100%;height:34px;margin:2px 0;display:flex;align-items:center;gap:9px;padding:0 10px;border-radius:3px;color:#8994a4;text-align:left}.nav:hover{background:#121925}.nav.active{color:#f0e6f0;background:linear-gradient(90deg,#66154f,#42122f);box-shadow:inset 2px 0 #e948c9}.ico{width:12px;text-align:center;color:#b18eb9}.main{min-width:0;min-height:0;display:flex;flex-direction:column}.view{display:none;min-height:0;height:100%;flex-direction:column}.view.active{display:flex}.toolbar{min-height:42px;display:flex;align-items:center;gap:5px;padding:0 9px;background:#0a0d13;border-bottom:1px solid #17202d;color:var(--muted)}.tool{height:30px;padding:0 10px;border-radius:3px;border:1px solid #263041;background:#101620;color:#9ca8b8;font-size:11px}.tool.active{background:#1b2230;color:#eef2fa;border-color:#4a5568}.tool.pink{background:#541271;border-color:#9b25c8;color:#f0d8f7}.grow{flex:1}.toggle{display:flex;align-items:center;gap:5px;font-size:11px}.toggle input{accent-color:#b52ad2}.matrix-wrap{position:relative;min-height:0;flex:1;background:linear-gradient(180deg,#0a0d14,#080a0f);overflow:auto}.matrix{display:grid;min-width:650px;grid-auto-rows:28px;border-bottom:1px solid var(--line)}.cell{display:flex;align-items:center;justify-content:center;border-right:1px solid #171e2b;border-bottom:1px solid #141a26;font-variant-numeric:tabular-nums;font-size:11px}.head{background:#0e131c;color:#9ca6b5;font-size:10px;letter-spacing:.35px}.strike{justify-content:flex-end;padding-right:8px;background:#0b0e15;color:#8994a4}.spot{box-shadow:inset 0 1px #e9dfc9,inset 0 -1px #e9dfc9}.positive-1{background:#210b2e}.positive-2{background:#4a075a;color:#f3d5f8}.positive-3{background:#8500b0;color:#fff}.negative-1{background:#290b14}.negative-2{background:#660711;color:#f7cbd0}.negative-3{background:#bd0614;color:#fff}.empty{color:#414c5c}.matrix-wrap.full-density .matrix{grid-auto-rows:34px}.spot-tag{position:sticky;left:0;z-index:5;width:max-content;margin-top:-15px;background:#e9e2d4;color:#211e1c;border-radius:2px;padding:3px 6px;font-size:8px;font-weight:700;box-shadow:0 0 8px #e9dfc966}.foot{height:30px;display:flex;align-items:center;gap:12px;padding:0 9px;background:#0c1119;border-top:1px solid #182130;color:#6f7a8a;font-size:11px}.foot strong{color:#adb7c6;font-weight:500}.chart{position:relative;flex:1;min-height:0;overflow:hidden;background:#080a10}.grid{position:absolute;inset:0 48px 0 0;background:repeating-linear-gradient(0deg,transparent 0,transparent 37px,#1d243022 38px),repeating-linear-gradient(90deg,transparent 0,transparent 80px,#1d243022 81px)}.watermark{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:34px;font-weight:800;letter-spacing:5px;color:#30344818}.candle{position:absolute;width:5px;border-radius:1px;opacity:.9}.candle:before{content:"";position:absolute;left:2px;width:1px;background:inherit;top:-7px;height:calc(100% + 14px)}.level{position:absolute;left:0;right:48px;height:2px;z-index:3}.level i{position:absolute;right:0;top:-8px;font-style:normal;font-size:8px;color:white;padding:2px 5px;border-radius:2px}.level.global{background:var(--yellow);box-shadow:0 0 7px #e8bd3d}.level.global i{background:#ac810e;color:#161208}.level.above{background:#b000db;box-shadow:0 0 7px #cb37eb}.level.above i{background:#9b00c1}.level.below{background:#d70a1b;box-shadow:0 0 7px #e7414d}.level.below i{background:#bd0715}.right-axis{position:absolute;right:0;top:0;bottom:0;width:48px;color:#697586;font-size:8px}.axis-item{position:absolute;right:7px}.chart-note{position:absolute;left:9px;bottom:9px;z-index:4;background:#101722dd;border:1px solid #293346;color:#9ea9b8;padding:4px 6px;border-radius:3px;font-size:8px}.error{position:absolute;inset:45% 0 auto;text-align:center;color:#c8747d}.hidden{display:none}@media(max-width:780px){.app{grid-template-columns:104px 1fr}.rail{padding:8px 5px}.nav{font-size:11px}.top .status{display:none}.matrix{min-width:540px}}
</style></head><body><div class="app">
<header class="top"><div class="brand"><span class="orb"></span>CIPHER</div><input class="ticker" id="ticker" value="ASTS" aria-label="Ticker"><span class="quote" id="quote"><strong>ASTS</strong>Loading</span><span class="source">OPRA + OI</span><span class="top-spacer"></span><span class="status"><span class="live">●</span>Read-only research</span></header>
<aside class="rail"><div class="rail-label">WORKSPACE</div><button class="nav active" data-view="matrix"><span class="ico">▦</span>Strike Matrix</button><button class="nav" data-view="night"><span class="ico">⌁</span>Night Vision</button><button class="nav" disabled><span class="ico">◌</span>Spyglass</button><div class="rail-label">RESEARCH</div><button class="nav" disabled><span class="ico">◈</span>Watchlists</button><button class="nav" disabled><span class="ico">◇</span>Journal</button><div class="rail-label">ACCOUNT</div><button class="nav" disabled><span class="ico">⚙</span>Settings</button></aside>
<main class="main"><section class="view active" id="matrixView"><div class="toolbar"><button class="tool active" data-matrix-exp="1">1 Exp</button><button class="tool" data-matrix-exp="5">Compact</button><button class="tool" data-matrix-exp="6">Full</button><span class="grow"></span><button class="tool active" data-density="compact">Compact rows</button><button class="tool" data-density="full">Full rows</button><button class="tool" id="refresh">Refresh</button><label class="toggle"><input id="auto" type="checkbox">Auto refresh</label></div><div class="matrix-wrap"><div class="matrix" id="matrix"></div><div class="spot-tag" id="spotTag">Loading</div></div><footer class="foot"><span id="footTicker">ASTS</span><strong id="coverage">Loading chain</strong><span id="provenance">OPRA snapshots + contract OI</span><span class="grow"></span><span id="updated">—</span></footer></section>
<section class="view" id="nightView"><div class="toolbar"><button class="tool active" data-night-exp="1">1 Exp</button><button class="tool" data-night-exp="5">Compact</button><button class="tool" data-night-exp="6">Full</button><button class="tool" data-night-exp="6">Leap</button><span class="grow"></span><button class="tool" data-frame="1d">1D</button><button class="tool active" data-frame="5m">5m</button><button class="tool" data-frame="15m">More</button><span class="status">Top pull <b style="color:var(--yellow)">●</b> Above <b style="color:#c637e9">●</b> Below <b style="color:#e3444f">●</b></span><label class="toggle"><input id="nightAuto" type="checkbox">Auto refresh</label></div><div class="chart" id="chart"><div class="grid"></div><div class="watermark">CIPHER</div><div class="right-axis" id="axis"></div><div class="chart-note" id="chartNote">Loading Night Vision</div></div></section></main></div>
<script>
const api='http://127.0.0.1:8182',state={ticker:'ASTS',matrixExp:1,nightExp:1,timeframe:'5m',matrix:null,night:null,bars:null,auto:null};
const $=s=>document.querySelector(s),fmt=n=>{const a=Math.abs(n||0),p=n<0?'-':'+';return p+'$'+(a>=1e6?(a/1e6).toFixed(1)+'M':(a/1e3).toFixed(1)+'K')};
const dte=iso=>{const today=new Date().toISOString().slice(0,10),d=Math.round((Date.parse(iso+'T00:00:00Z')-Date.parse(today+'T00:00:00Z'))/864e5);return Math.max(0,d+1)+'d'};
function heat(v,max){if(!v)return'empty';const q=Math.abs(v)/(max||1);return v>0?(q>.7?'positive-3':q>.3?'positive-2':'positive-1'):(q>.7?'negative-3':q>.3?'negative-2':'negative-1')}
function renderMatrix(){const d=state.matrix;if(!d)return;const exps=d.expirations.slice(0,state.matrixExp),rows=d.rows;const matrix=$('#matrix');matrix.innerHTML='';matrix.style.gridTemplateColumns='55px repeat('+exps.length+',1fr)';matrix.append(...['STRIKE',...exps.map(dte)].map((x,i)=>{const n=document.createElement('div');n.className='cell head';n.textContent=x;return n}));const vals=rows.flatMap(r=>r.cells.map(c=>c.net_gex||0)),max=Math.max(...vals.map(Math.abs),1);for(const row of [...rows].reverse()){const s=document.createElement('div');s.className='cell strike '+(row.is_spot_band?'spot':'');s.textContent=row.strike.toFixed(1);matrix.append(s);for(const exp of exps){const c=row.cells.find(x=>x.expiration===exp),n=document.createElement('div');n.className='cell '+heat(c?.net_gex,max)+' '+(row.is_spot_band?'spot':'');n.textContent=c?.available?fmt(c.net_gex):'—';matrix.append(n)}}const spot=d.quote.price_context;$('#spotTag').textContent=d.ticker+' '+(spot?spot.toFixed(2):'—');$('#quote').innerHTML='<strong>'+d.ticker+'</strong>'+(spot?'$'+spot.toFixed(2):'Unavailable');$('#footTicker').textContent=d.ticker;const live=rows.flatMap(r=>r.cells).filter(c=>c.available).length;$('#coverage').textContent=live+' calculated cells · '+d.coverage.contracts+' snapshots';$('#updated').textContent='Updated '+new Date(d.as_of).toLocaleTimeString();}
function renderNight(){const d=state.night,b=state.bars?.bars||[];if(!d)return;const chart=$('#chart');chart.querySelectorAll('.level,.candle').forEach(n=>n.remove());const prices=[...b.flatMap(x=>[x.high,x.low]),...(d.levels||[]).map(x=>x.price)].filter(Number.isFinite);if(!prices.length)return;const hi=Math.max(...prices),lo=Math.min(...prices),span=Math.max(hi-lo,.01),y=p=>6+(hi-p)/span*86;const axis=$('#axis');axis.innerHTML='';[hi,(hi+lo)/2,lo].forEach(p=>{const n=document.createElement('span');n.className='axis-item';n.style.top=y(p)+'%';n.textContent=p.toFixed(2);axis.append(n)});b.slice(-80).forEach((x,i)=>{const n=document.createElement('i');n.className='candle';n.style.left=(3+i*1.15)+'%';n.style.top=y(Math.max(x.open,x.close))+'%';n.style.height=Math.max(2,Math.abs(y(x.open)-y(x.close)))+'%';n.style.background=x.close>=x.open?'#ae14df':'#da1021';chart.append(n)});(d.levels||[]).forEach((l,i)=>{const n=document.createElement('div');n.className='level '+(l.kind==='global'?'global':l.kind==='above_spot'?'above':'below');n.style.top=y(l.price)+'%';n.innerHTML='<i>'+l.price.toFixed(2)+'</i>';chart.append(n)});$('#chartNote').textContent=d.levels?.length?'OPRA + OI levels · '+d.levels.length+' shown':'No calculated levels available';}
async function load(){const t=$('#ticker').value.trim().toUpperCase();if(!/^[A-Z.]{1,8}$/.test(t))return;state.ticker=t;$('#coverage').textContent='Loading chain…';try{const q='ticker='+encodeURIComponent(t)+'&feed=opra&depth=35&expirations=6';const [m,n,b]=await Promise.all([fetch(api+'/api/matrix?'+q),fetch(api+'/api/night-vision?'+q+'&expirations='+state.nightExp),fetch(api+'/api/bars?ticker='+encodeURIComponent(t)+'&timeframe='+state.timeframe)]);if(!m.ok)throw Error('Matrix unavailable');state.matrix=await m.json();state.night=n.ok?await n.json():null;state.bars=b.ok?await b.json():null;renderMatrix();renderNight()}catch(e){$('#coverage').textContent='Data unavailable';$('#quote').textContent=t+' unavailable';$('#chartNote').textContent='Unable to load local research data'}}
function setAuto(on){clearInterval(state.auto);state.auto=on?setInterval(load,60000):null;$('#auto').checked=on;$('#nightAuto').checked=on}
$('#ticker').addEventListener('keydown',e=>{if(e.key==='Enter')load()});$('#refresh').onclick=load;
document.querySelectorAll('[data-matrix-exp]').forEach(b=>b.onclick=()=>{state.matrixExp=+b.dataset.matrixExp;document.querySelectorAll('[data-matrix-exp]').forEach(x=>x.classList.toggle('active',x===b));renderMatrix()});
document.querySelectorAll('[data-density]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-density]').forEach(x=>x.classList.toggle('active',x===b));$('.matrix-wrap').classList.toggle('full-density',b.dataset.density==='full')});
document.querySelectorAll('[data-night-exp]').forEach(b=>b.onclick=()=>{state.nightExp=+b.dataset.nightExp;document.querySelectorAll('[data-night-exp]').forEach(x=>x.classList.toggle('active',x===b));load()});
document.querySelectorAll('[data-frame]').forEach(b=>b.onclick=()=>{state.timeframe=b.dataset.frame;document.querySelectorAll('[data-frame]').forEach(x=>x.classList.toggle('active',x===b));load()});
$('#nightAuto').onchange=e=>setAuto(e.target.checked);$('#auto').onchange=e=>setAuto(e.target.checked);
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x===b));$('#matrixView').classList.toggle('active',b.dataset.view==='matrix');$('#nightView').classList.toggle('active',b.dataset.view==='night');if(b.dataset.view==='night')renderNight()});load();
</script></body></html>
