[pytest]
# Keep bare `pytest` on the active Cipher suite. The repository also contains
# archived third-party Kronos tests under `Stock data/external/` whose standalone
# package import layout is intentionally not part of this product's validation.
addopts = cipher-system/tests
testpaths = cipher-system/tests
norecursedirs = Stock* external previous-work node_modules .venv* data __pycache__
